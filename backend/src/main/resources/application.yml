server:
  port: 8080

spring:
  application:
    name: syndicate-backend
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://${SYNDICATE_DB_HOST:localhost}:${SYNDICATE_DB_PORT:5432}/${SYNDICATE_DB_NAME:syndicate}
    username: ${SYNDICATE_DB_USER:syndicate}
    password: ${SYNDICATE_DB_PASSWORD:syndicate}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

syndicate:
  jwt:
    secret: ${SYNDICATE_JWT_SECRET:dev-only-secret-change-me-please-this-must-be-at-least-32-bytes-long}
    # The access token is short-lived and kept only in the page's memory; the session cookie
    # below is what keeps someone signed in.
    expiration-ms: ${SYNDICATE_JWT_EXPIRATION_MS:900000}
  session:
    refresh-days: ${SYNDICATE_SESSION_DAYS:14}
    # Cookies are marked Secure by default. Set false only to run over plain http locally.
    secure-cookie: ${SYNDICATE_SECURE_COOKIE:true}
  rate-limit:
    # Attempts allowed per source address per window, on the endpoints anyone can reach.
    window-seconds: ${SYNDICATE_RATE_LIMIT_WINDOW_SECONDS:300}
    sign-in: ${SYNDICATE_RATE_LIMIT_SIGN_IN:10}
    sign-up: ${SYNDICATE_RATE_LIMIT_SIGN_UP:5}
  jobs:
    # Background extraction runs in this process. Set enabled=false to run an API-only instance.
    enabled: ${SYNDICATE_JOBS_ENABLED:true}
    poll-ms: ${SYNDICATE_JOBS_POLL_MS:1000}
  storage:
    type: ${SYNDICATE_STORAGE_TYPE:filesystem}
    upload-dir: ${SYNDICATE_UPLOAD_DIR:./uploads}
    s3:
      bucket: ${SYNDICATE_S3_BUCKET:syndicate-evidence}
      region: ${SYNDICATE_S3_REGION:us-east-1}
      endpoint: ${SYNDICATE_S3_ENDPOINT:}
      access-key: ${SYNDICATE_S3_ACCESS_KEY:minioadmin}
      secret-key: ${SYNDICATE_S3_SECRET_KEY:minioadmin}
      path-style-access: ${SYNDICATE_S3_PATH_STYLE:true}
  malware:
    scanner: ${SYNDICATE_MALWARE_SCANNER:passthrough}
    clamav:
      host: ${SYNDICATE_CLAMAV_HOST:localhost}
      port: ${SYNDICATE_CLAMAV_PORT:3310}
      timeout-ms: ${SYNDICATE_CLAMAV_TIMEOUT_MS:5000}
  cors:
    # Empty by default: the app and API share an origin. Set only for a separately hosted front end.
    allowed-origins: ${SYNDICATE_CORS_ORIGINS:}
