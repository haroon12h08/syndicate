server:
  port: 8080

spring:
  application:
    name: syndicate-backend
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://${SYNDICATE_DB_HOST:localhost}:${SYNDICATE_DB_PORT:5432}/${SYNDICATE_DB_NAME:syndicate}
    username: ${SYNDICATE_DB_USER:syndicate}
    password: ${SYNDICATE_DB_PASSWORD:syndicate}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  rabbitmq:
    host: ${SYNDICATE_RABBITMQ_HOST:localhost}
    port: ${SYNDICATE_RABBITMQ_PORT:5672}
    username: ${SYNDICATE_RABBITMQ_USER:guest}
    password: ${SYNDICATE_RABBITMQ_PASSWORD:guest}
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

syndicate:
  jwt:
    secret: ${SYNDICATE_JWT_SECRET:dev-only-secret-change-me-please-this-must-be-at-least-32-bytes-long}
    expiration-ms: ${SYNDICATE_JWT_EXPIRATION_MS:86400000}
  storage:
    upload-dir: ${SYNDICATE_UPLOAD_DIR:./uploads}
  cors:
    allowed-origins: ${SYNDICATE_CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://127.0.0.1:5173,http://127.0.0.1:5174}
