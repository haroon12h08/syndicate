# Syndicate runs as two containers: the product, and its database.
#
# The app image contains the web app and the API, so there is one port, one origin and no URL to
# configure. Flyway migrations run at startup, so there is no separate migrate step.
services:
  postgres:
    image: postgres:16-alpine
    container_name: syndicate-postgres
    environment:
      POSTGRES_DB: ${SYNDICATE_DB_NAME:-syndicate}
      POSTGRES_USER: ${SYNDICATE_DB_USER:-syndicate}
      POSTGRES_PASSWORD: ${SYNDICATE_DB_PASSWORD:?set SYNDICATE_DB_PASSWORD in .env}
    volumes:
      - syndicate-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SYNDICATE_DB_USER:-syndicate} -d ${SYNDICATE_DB_NAME:-syndicate}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: syndicate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SYNDICATE_DB_HOST: postgres
      SYNDICATE_DB_PORT: 5432
      SYNDICATE_DB_NAME: ${SYNDICATE_DB_NAME:-syndicate}
      SYNDICATE_DB_USER: ${SYNDICATE_DB_USER:-syndicate}
      SYNDICATE_DB_PASSWORD: ${SYNDICATE_DB_PASSWORD:?set SYNDICATE_DB_PASSWORD in .env}
      SYNDICATE_JWT_SECRET: ${SYNDICATE_JWT_SECRET:?set SYNDICATE_JWT_SECRET in .env}
      SYNDICATE_PUBLIC_URL: ${SYNDICATE_PUBLIC_URL:-http://localhost:8080}
      SYNDICATE_UPLOAD_DIR: /data/uploads
    ports:
      - "${SYNDICATE_PORT:-8080}:8080"
    volumes:
      - syndicate-uploads:/data/uploads
    restart: unless-stopped

volumes:
  syndicate-db:
  syndicate-uploads:
